<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlineopoly - Online Game</title>

    <style>
      body {
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    background-color: #c2eccd;
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #222;
}

.menu {
    background-color: white;
    border: 5px solid black;
    border-radius: 25px;
    padding: 35px;
    width: 800px;
    max-width: 100%;
    box-sizing: border-box;
}

h1 {
    color: #f48859;
    text-align: center;
    font-size: 36px;
    margin-top: 0;
}

h2 {
    text-align: center;
    font-size: 25px;
}

#welcome {
    text-align: center;
    font-size: 18px;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    box-sizing: border-box;
    padding: 14px 20px;
    background-color: #e52521;
    color: white;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #bd1c19;
}

button:disabled {
    background-color: #999;
    cursor: not-allowed;
}

.game {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px;
    margin-top: 12px;
    background-color: #f3f8f4;
    border: 1px solid #c2eccd;
    border-radius: 10px;
}

.game p {
    margin: 0;
    font-size: 16px;
}

#game-list {
    margin-top: 15px;
}

#message {
    text-align: center;
    min-height: 24px;
    margin-top: 20px;
}

@media (max-width: 550px) {
    body {
        padding: 15px;
        align-items: flex-start;
    }

    .menu {
        padding: 22px;
    }

    .game {
        align-items: flex-start;
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }
}
    </style>
</head>

<body>
    <main class="menu">
        <h1>Onlineopoly</h1>
        <h2>Online Game</h2>

        <div class="actions">
            <button id="create-game">Create Game</button>
            <button id="refresh-games">Refresh Games</button>
            <button id="back-to-menu">Back to Menu</button>
        </div>

        <p id="message" role="status"></p>

        <h2>Available Games</h2>
        <div id="game-list">
            Loading games...
        </div>
    </main>

    <script>
       const message = document.getElementById('message');
       const gameList = document.getElementById('game-list');

async function loadLobby() {
    try {
        // Get the logged-in player's information
        const sessionResponse = await fetch('/session');
        const session = await sessionResponse.json();

        if (!session.loggedIn) {
            window.location.href = '/login';
            return;
        }

        // Get the list of available games
        await loadGames();

    } catch (error) {
        if (message) {
            message.textContent = 'Could not load the lobby.';
        }
        console.error(error);
    }
}

async function loadGames() {
    const response = await fetch('/games');
    const data = await response.json();

    gameList.replaceChildren();

    if (!data.games || data.games.length === 0) {
        gameList.textContent = 'No games available. Create one!';
        return;
    }

    data.games.forEach(game => {
        const gameItem = document.createElement('div');

        const gameInfo = document.createElement('p');
        gameInfo.textContent =
            `Game #${game.game_id} — Players: ${game.player_count}`;

        const joinButton = document.createElement('button');
        joinButton.textContent = 'Join Game';

        joinButton.addEventListener('click', async () => {
            try {
                const joinResponse = await fetch('/games/join', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        gameId: game.game_id
                    })
                });

                const result = await joinResponse.json();

                if (!joinResponse.ok) {
                    throw new Error(result.message || 'Could not join game.');
                }

                if (message) {
                    message.textContent = result.message || 'Joined game!';
                }

                await loadGames();

            } catch (error) {
                if (message) {
                    message.textContent = error.message;
                }
            }
        });

        gameItem.append(gameInfo, joinButton);
        gameList.appendChild(gameItem);
    });
}

const refreshButton = document.getElementById('refresh-games');

if (refreshButton) {
    refreshButton.addEventListener('click', loadGames);
}

loadLobby();

const createButton = document.getElementById('create-game');

if (createButton) {
    createButton.addEventListener('click', async () => {
        try {
            if (message) {
                message.textContent = 'Creating game...';
            }

            // Ask the server to create a game
            const createResponse = await fetch('/games/create', {
                method: 'POST'
            });

            const createdGame = await createResponse.json();

            if (!createResponse.ok) {
                throw new Error(
                    createdGame.message || 'Could not create game.'
                );
            }

            // Automatically join the newly created game
            const joinResponse = await fetch('/games/join', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    gameId: createdGame.gameId
                })
            });

            const joinedGame = await joinResponse.json();

            if (!joinResponse.ok) {
                throw new Error(
                    joinedGame.message || 'Game created, but joining failed.'
                );
            }

            if (message) {
                message.textContent =
                    `Game #${createdGame.gameId} created! You joined as the first player.`;
            }

            // Update the visible game list
            await loadGames();

        } catch (error) {
            if (message) {
                message.textContent = error.message;
            }

            console.error(error);
        }
    });
}

const backButton = document.getElementById('back-to-menu');

backButton.addEventListener('click', () => {
    window.location.href = '/menu';
});
    </script>
</body>
</html>
